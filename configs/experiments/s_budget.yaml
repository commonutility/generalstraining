# Shared constrained-budget config. Initialization is supplied on the CLI so
# scratch and pretrained runs cannot accidentally differ in other settings.
run_name: s_budget

pad_to: 12
min_grid_size: 11
max_grid_size: 12
min_generals_distance: 2
max_generals_distance: 6
truncation: 1024
mountain_density_min: 0.18
mountain_density_max: 0.26
castle_val_min: 13
castle_val_max: 18
num_cities_min: 2
num_cities_max: 4
pool_size: 10000
reset_pool_every: 10

curriculum:
  - min_generals_distance: 2
    max_generals_distance: 6
    num_cities_min: 2
    num_cities_max: 4
  - win_rate_threshold: 0.6
    min_generals_distance: 6
    max_generals_distance: 10
    num_cities_min: 2
    num_cities_max: 4
  - win_rate_threshold: 0.6
    min_generals_distance: 11
    max_generals_distance: 17
    num_cities_min: 2
    num_cities_max: 4

network: history_transformer
depth: 4
embed_dim: 352
n_head: 8
ff_factor: 2
patch_size: 2
use_bf16: true

num_envs: 256
num_steps: 256
num_iters: 1000
minibatch_size: 1024
seed: 44
num_epochs: 1

gamma: 1.0
gae_lambda: 0.9
clip_eps: 0.2
max_grad_norm: 0.267
vf_coef: 0.5
target_kl: 0.02
adv_top_frac: 0.5

ent_schedule: power_law
ent_coef_start: 0.05
ent_power: 0.2
ent_coef_min: 0.001

lr_schedule: power_law
lr_power_law_numerator: 0.5
lr_power_law_exponent: 1.1
lr_power_law_min: 5e-6
lr_power_law_max: 1e-4

value_loss: ce
num_bins: 128
v_min: -1.0
v_max: 1.0
hl_sigma: 0.04

eval_every: 25
eval_games: 256
ckpt_every: 100
save_every: 100
debug: false
